name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0 # skip git-hook install in CI; the gates below ARE the hooks
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      # The unwired-export gap rule shells out to ripgrep and fails loudly if it's
      # missing. ubuntu-latest ships rg, but ensure it so CI never silently differs.
      - name: Ensure ripgrep
        run: rg --version || (sudo apt-get update && sudo apt-get install -y ripgrep)

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Test
        run: bun test
