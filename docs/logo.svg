<svg width="1280" height="440" viewBox="0 0 1280 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="trustmebro-meter logo: a friendly LLM robot insisting the feature is done while the BS meter spikes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF7ED"/>
      <stop offset="1" stop-color="#FFE4D6"/>
    </linearGradient>
    <linearGradient id="bot" x1="120" y1="120" x2="360" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="gauge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="0.55" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <style>
      .wm   { font-family: 'Trebuchet MS','Segoe UI',Verdana,sans-serif; font-weight: 800; }
      .wm2  { font-family: 'Trebuchet MS','Segoe UI',Verdana,sans-serif; font-weight: 800; }
      .tag  { font-family: 'Trebuchet MS','Segoe UI',Verdana,sans-serif; font-weight: 600; }
      .lbl  { font-family: 'Trebuchet MS','Segoe UI',Verdana,sans-serif; font-weight: 800; }
      .bub  { font-family: 'Trebuchet MS','Segoe UI',Verdana,sans-serif; font-weight: 700; }
    </style>
  </defs>

  <!-- background -->
  <rect x="6" y="6" width="1268" height="428" rx="40" fill="url(#bg)" stroke="#FDBA74" stroke-width="4"/>

  <!-- ===== mascot: a friendly little LLM ===== -->
  <g transform="translate(150 120)">
    <!-- antenna -->
    <line x1="120" y1="22" x2="120" y2="-14" stroke="#6366F1" stroke-width="8" stroke-linecap="round"/>
    <circle cx="120" cy="-22" r="13" fill="#FB7185"/>
    <!-- head/body -->
    <rect x="20" y="20" width="200" height="180" rx="46" fill="url(#bot)" stroke="#6366F1" stroke-width="6"/>
    <!-- "LLM" badge on the forehead -->
    <rect x="86" y="36" width="68" height="30" rx="15" fill="#EEF2FF" stroke="#6366F1" stroke-width="3"/>
    <text x="120" y="58" class="lbl" font-size="20" fill="#4338CA" text-anchor="middle">LLM</text>
    <!-- face panel -->
    <rect x="44" y="78" width="152" height="104" rx="30" fill="#EEF2FF"/>
    <!-- eyes (big & friendly) -->
    <circle cx="92" cy="124" r="22" fill="#fff" stroke="#312E81" stroke-width="4"/>
    <circle cx="148" cy="124" r="22" fill="#fff" stroke="#312E81" stroke-width="4"/>
    <circle cx="97" cy="128" r="9" fill="#312E81"/>
    <circle cx="153" cy="128" r="9" fill="#312E81"/>
    <circle cx="100" cy="125" r="3" fill="#fff"/>
    <circle cx="156" cy="125" r="3" fill="#fff"/>
    <!-- rosy cheeks -->
    <circle cx="66" cy="150" r="11" fill="#FCA5A5" opacity="0.8"/>
    <circle cx="174" cy="150" r="11" fill="#FCA5A5" opacity="0.8"/>
    <!-- big confident grin -->
    <path d="M92 158 q28 26 56 0" stroke="#312E81" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- one nervous sweat drop -->
    <path d="M196 96 q10 16 0 24 q-10 -8 0 -24 Z" fill="#60A5FA"/>
    <!-- little waving arm / shaka -->
    <path d="M222 150 q40 6 52 -22" stroke="#6366F1" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="276" cy="126" r="12" fill="#A5B4FC" stroke="#6366F1" stroke-width="4"/>
  </g>

  <!-- speech bubble: the confident lie -->
  <g transform="translate(330 96)">
    <rect x="0" y="0" width="246" height="86" rx="22" fill="#fff" stroke="#312E81" stroke-width="4"/>
    <path d="M40 84 l-14 30 l44 -28 Z" fill="#fff" stroke="#312E81" stroke-width="4"/>
    <text x="123" y="38" class="bub" font-size="26" fill="#312E81" text-anchor="middle">it's done!</text>
    <text x="123" y="68" class="bub" font-size="26" fill="#6366F1" text-anchor="middle">trust me bro</text>
  </g>

  <!-- ===== the meter (calling the bluff) ===== -->
  <g transform="translate(470 250)">
    <path d="M0 90 A110 110 0 0 1 220 90" fill="none" stroke="url(#gauge)" stroke-width="20" stroke-linecap="round"/>
    <text x="6" y="116" class="tag" font-size="18" fill="#059669">DONE</text>
    <text x="176" y="116" class="tag" font-size="18" fill="#E11D48">SUS</text>
    <!-- needle pegged deep in the red -->
    <g transform="translate(110 90) rotate(64)">
      <path d="M0 8 L92 0 L0 -8 Z" fill="#312E81"/>
    </g>
    <circle cx="110" cy="90" r="13" fill="#312E81"/>
    <text x="110" y="150" class="tag" font-size="17" fill="#9A3412" text-anchor="middle">BS meter: high</text>
  </g>

  <!-- ===== wordmark ===== -->
  <g transform="translate(720 175)">
    <text x="0" y="0" class="wm" font-size="78" fill="#312E81">trustmebro</text>
    <text x="0" y="64" class="wm2" font-size="78" fill="#FB7185">-meter</text>
    <text x="4" y="118" class="tag" font-size="26" fill="#9A3412">does the AI's "it's done" actually check out?</text>
  </g>
</svg>
